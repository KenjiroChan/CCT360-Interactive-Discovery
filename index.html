<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Roll 36</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=IBM+Plex+Mono:wght@400;600&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="site-header">
        <p class="logo">ROLL <span>36</span></p>
    </header>
<main>
    //this is the landing page with the image of the camera  on the lost and found shelf 
    <section id="camera" class="scene">
    </section>

    <section id="darkroom" class="scene" hidden>
    </section>

    <section id="lighttable" class="scene" hidden>
        <h2>Closely investigate each print</h2>
        <p>Here, you can choose a print, then investigate it. Click the part of the photo that might look important.</p>
        
        <div id="prints" class="contact-sheet"></div>

        <div id="viewer" class="viewer" hidden>
            <div class ="viewer-photo">
                <img id="viewerImg" src="" alt="">
                <div id="photoGrid" class="photo-grid"></div>
            </div>
            <div>
                <h3 id="viewerTitle"></h3>
                <p id="viewerStatus" class="message"></p>
                <p id="viewerClue" class="clue-note" hidden></p>
            </div>
        </div>
        <button class="main-btn" onclick="showScene('clueboard')">Go to the clue board</button>
    </section>
    
    <section id="clueboard" class="scene" hidden>
    </section>

    <section id="finalframe" class="scene" hidden>
        <h2>Frame 36</h2>
    </section>
    
    <section id="ending" class="scene" hidden>
        <h2>The End</h2>
    </section>

</main>
